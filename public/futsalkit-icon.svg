<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background with two-tone gradient -->
  <rect x="0" y="0" width="512" height="512" rx="110" ry="110" fill="url(#bgGradient)"/>

  <!-- Ball: flat white circle -->
  <circle cx="256" cy="256" r="150" fill="#FFFFFF"/>

  <!-- Ball seam lines (radiating from center pentagon to edge) -->
  <g stroke="#1E3A8A" stroke-width="10" stroke-linecap="round">
    <line x1="256" y1="201" x2="256" y2="116"/>
    <line x1="308.3" y1="238.9" x2="389.1" y2="212.7"/>
    <line x1="288.3" y1="300.5" x2="338.3" y2="369.3"/>
    <line x1="223.7" y1="300.5" x2="173.7" y2="369.3"/>
    <line x1="203.7" y1="238.9" x2="122.9" y2="212.7"/>
  </g>

  <!-- Seam end points -->
  <g fill="#1E3A8A">
    <circle cx="256" cy="116" r="9"/>
    <circle cx="389.1" cy="212.7" r="9"/>
    <circle cx="338.3" cy="369.3" r="9"/>
    <circle cx="173.7" cy="369.3" r="9"/>
    <circle cx="122.9" cy="212.7" r="9"/>
  </g>

  <!-- Center pentagon panel -->
  <polygon points="256,201 308.3,238.9 288.3,300.5 223.7,300.5 203.7,238.9" fill="#1E3A8A"/>
</svg>
